[package]
name = "ikigai-credential"
description = "Verifiable credentials as ikigai resources: issue and verify W3C VC 2.0 in the Open Badges 3.0 profile, secured with Data Integrity eddsa-rdfc-2022, with Bitstring Status Lists."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["ikigai", "credentials", "open-badges", "rdf", "roc"]
categories = ["wasm", "cryptography"]
# A scaffold: nothing is published until issuing and verifying are built and interoperate.
publish = false

[dependencies]
ikigai-jsonld = "0.5.3"
ikigai-rdf = { version = "0.7.0", default-features = false }
ikigai-sign = "0.6.2"
json-ld = { version = "0.21", default-features = false }
rdf-types = "0.22"
oxrdf = "0.3"
serde_json = "1"
sha2 = "0.10"
futures = { version = "0.3", default-features = false, features = ["executor"] }
ed25519-dalek = "2"
oxsdatatypes = "0.2"
ikigai-core = "0.4.3"
async-trait = "0.1"
base64 = "0.22"
oxrdfio = "0.2"
getrandom = "0.3"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
